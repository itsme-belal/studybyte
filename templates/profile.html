{% extends "base.html" %}
{% block content %}
<div class="card max-w-lg mx-auto">
    <h2 class="mb-4">My Profile Settings</h2>
    <form method="POST" enctype="multipart/form-data">
        
        <div class="dashboard-grid mb-4" style="grid-template-columns: 1fr 1fr;">
            <!-- Profile Pic -->
            <div class="form-group text-center">
                {% if user.profile_pic %}
                    <img src="{{ user.profile_pic }}" alt="Profile" style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin:0 auto; display:block;">
                {% else %}
                    <div style="width:100px;height:100px;border-radius:50%;background:var(--bg-surface-hover);display:flex;align-items:center;justify-content:center;margin:0 auto;">No Image</div>
                {% endif %}
                <label class="form-label mt-2">Profile Picture</label>
                <input type="file" name="profile_pic" class="form-control" accept="image/*" style="font-size: 0.8rem; padding: 0.3rem;">
            </div>
            
            <!-- Cover Photo -->
            <div class="form-group text-center">
                 {% if user.cover_photo %}
                    <img src="{{ user.cover_photo }}" alt="Cover" style="width:100%; height:100px; border-radius:8px; object-fit:cover; margin:0 auto; display:block;">
                {% else %}
                    <div style="width:100%;height:100px;border-radius:8px;background:var(--bg-surface-hover);display:flex;align-items:center;justify-content:center;">No Cover</div>
                {% endif %}
                <label class="form-label mt-2">Cover Photo</label>
                <input type="file" name="cover_photo" class="form-control" accept="image/*" style="font-size: 0.8rem; padding: 0.3rem;">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>

        {% if user.role != 'admin' %}
        <div class="form-group">
            <label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" value="{{ user.department or '' }}" placeholder="E.g., CSE">
        </div>
        {% endif %}
        
        <div class="form-group">
            <label class="form-label">Bio / About Me</label>
            <textarea name="bio" class="form-control" rows="4" placeholder="Tell students about yourself...">{{ user.bio or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Skills / Subjects (comma-separated tags)</label>
            <input type="text" name="skills" class="form-control" value="{{ user.skills or '' }}" placeholder="Python, Web Dev, SQL">
        </div>

        <div class="form-group">
            <label class="form-label">Education / Certifications</label>
            <textarea name="education" class="form-control" rows="2" placeholder="B.Sc in CSE, EWU...">{{ user.education or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Social Links URL (LinkedIn, GitHub)</label>
            <input type="text" name="social_links" class="form-control" value="{{ user.social_links or '' }}" placeholder="https://linkedin.com/in/... ">
        </div>

        <button type="submit" class="btn btn-primary w-full mt-4">Save Profile Changes</button>
    </form>
</div>
{% endblock %}
