{% extends "base.html" %}
{% block content %}
<div class="card max-w-lg mx-auto">
    <h2 class="mb-4">My Profile Settings</h2>
    <form method="POST" enctype="multipart/form-data">
        
        <div class="dashboard-grid mb-4" style="grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; align-items: start;">
            <!-- Profile Pic Section -->
            <div class="form-group text-center" style="display: flex; flex-direction: column; align-items: center;">
                <label class="form-label mb-2">PROFILE PICTURE</label>
                <div id="profile-container" style="position: relative; width: 140px; height: 140px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 3px solid var(--border); background: var(--bg-surface-hover); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;"
                     onclick="document.getElementById('profile_input').click()">
                    
                    <!-- Centered Label -->
                    <span id="profile-placeholder" style="z-index: 1; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.05em;">Profile</span>
                    
                    {% if user.profile_pic %}
                    <img src="{{ user.profile_pic }}" id="profile-preview" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2;" onerror="this.style.display='none'">
                    {% else %}
                    <img id="profile-preview" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2;" onerror="this.style.display='none'">
                    {% endif %}

                    <!-- Hover Overlay -->
                    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; z-index: 3;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'">
                        <i class="fa-solid fa-camera text-white" style="font-size: 1.5rem;"></i>
                    </div>
                </div>
                <input type="file" id="profile_input" name="profile_pic" accept="image/*" style="display: none;" onchange="previewImage(this, 'profile-preview')">
                <p class="text-muted mt-2" style="font-size: 0.65rem;">Square Recommended</p>
            </div>

            <!-- Cover Photo Section -->
            <div class="form-group" style="position: relative; width: 100%;">
                <label class="form-label mb-2">COVER PHOTO</label>
                <div id="cover-container" style="position: relative; height: 140px; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px dashed var(--border); background: var(--bg-surface-hover); display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;" 
                     onclick="document.getElementById('cover_input').click()"
                     onmouseover="this.style.borderColor='var(--accent-teal)'"
                     onmouseout="this.style.borderColor='var(--border)'">
                    
                    <!-- Centered Label -->
                    <span id="cover-placeholder" style="z-index: 1; font-size: 1rem; font-weight: 800; color: var(--text-muted); letter-spacing: 0.1em;">Cover</span>
                    
                    {% if user.cover_photo %}
                    <img src="{{ user.cover_photo }}" id="cover-preview" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2;" onerror="this.style.display='none'">
                    {% else %}
                    <img id="cover-preview" style="display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2;" onerror="this.style.display='none'">
                    {% endif %}

                    <!-- Hover Overlay -->
                    <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; z-index: 3;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'">
                        <i class="fa-solid fa-camera text-white" style="font-size: 2rem;"></i>
                    </div>
                </div>
                <input type="file" id="cover_input" name="cover_photo" accept="image/*" style="display: none;" onchange="previewImage(this, 'cover-preview')">
            </div>
        </div>



        <script>
            function previewImage(input, previewId) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.getElementById(previewId);
                        img.src = e.target.result;
                        img.style.display = 'block';
                    }
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>



        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
        </div>

        {% if user.role != 'admin' %}
        <div class="form-group">
            <label class="form-label">Department</label>
            <select name="department" class="form-control">
                <option value="">— Select Department —</option>
                {% for dept in departments %}
                <option value="{{ dept }}" {% if user.department == dept %}selected{% endif %}>{{ dept }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}
        
        <div class="form-group">
            <label class="form-label">Bio / About Me</label>
            <textarea name="bio" class="form-control" rows="4" placeholder="Tell students about yourself...">{{ user.bio or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Skills / Subjects (comma-separated tags)</label>
            <input type="text" name="skills" class="form-control" value="{{ user.skills or '' }}" placeholder="Python, Web Dev, SQL">
        </div>

        <div class="form-group">
            <label class="form-label">Education / Certifications</label>
            <textarea name="education" class="form-control" rows="2" placeholder="B.Sc in CSE, EWU...">{{ user.education or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label">Social Links URL (LinkedIn, GitHub)</label>
            <input type="text" name="social_links" class="form-control" value="{{ user.social_links or '' }}" placeholder="https://linkedin.com/in/... ">
        </div>

        <button type="submit" class="btn btn-primary w-full mt-4">Save Profile Changes</button>
    </form>
</div>

<div class="card max-w-lg mx-auto" style="margin-top: 2rem;">
    <h2 class="mb-4 text-warning">Security Settings</h2>
    <form method="POST" action="{{ url_for('change_password') }}">
        <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" name="current_password" class="form-control" required placeholder="Enter current password...">
        </div>
        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" required placeholder="At least 6 characters...">
        </div>
        <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required placeholder="Retype new password...">
        </div>
        <button type="submit" class="btn btn-warning w-full mt-4">Update Password</button>
    </form>
</div>
{% endblock %}
