{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2 class="text-teal mb-4"><i class="fa-solid fa-headset mr-2"></i> Submit Support Ticket</h2>
    <p class="text-muted mb-4 text-sm">Facing issues with the platform, tokens, or have general feedback? Open a direct channel to StudyByte Admins below.</p>
    
    <form method="POST" action="{{ url_for('report_support_ticket') }}">
        <div class="mb-4">
            <label class="font-bold mb-2 block">Subject</label>
            <input type="text" name="subject" class="form-control" placeholder="E.g. Token Purchase Failed, Suggestion..." required maxlength="200">
        </div>
        
        <div class="mb-4">
            <label class="font-bold mb-2 block">Detailed Message</label>
            <textarea name="message" class="form-control h-32" placeholder="Please describe your issue or inquiry in detail..." required></textarea>
        </div>
        
        <div class="flex gap-4">
            <button type="submit" class="btn btn-primary flex-grow">Submit Ticket</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
