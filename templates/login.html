{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="card">
        <h2 class="mb-4 text-center text-teal">Welcome Back</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="student@std.ewubd.edu">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <!-- We will determine role upon login, but letting them choose the active identity allows one account to act as both -->
            <div class="form-group">
                <label class="form-label">Login as</label>
                <select name="role" class="form-control">
                    <option value="learner">Learner</option>
                    <option value="tutor">Tutor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        <p class="text-center mt-4 text-muted">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-teal" style="text-decoration: none;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
