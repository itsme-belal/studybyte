{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div class="card">
        <h2 class="mb-4 text-teal">Leave a Review</h2>
        <p class="text-muted mb-4">How was your session with <strong>{{ tutor.name }}</strong> for "{{ listing.title }}"?</p>
        
        <form method="POST" action="{{ url_for('review', booking_id=booking.id) }}">
            <div class="form-group">
                <label class="form-label">Rating (1-5 Stars)</label>
                <select name="rating" class="form-control" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5) Excellent</option>
                    <option value="4">⭐⭐⭐⭐ (4) Good</option>
                    <option value="3">⭐⭐⭐ (3) Average</option>
                    <option value="2">⭐⭐ (2) Poor</option>
                    <option value="1">⭐ (1) Terrible</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Written Feedback</label>
                <textarea name="comment" class="form-control" rows="4" placeholder="The tutor explained everything clearly..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Review</button>
        </form>
    </div>
</div>
{% endblock %}
