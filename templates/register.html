{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <h2 class="mb-4 text-center text-teal">Create Account</h2>
        <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Student ID</label>
                <input type="text" name="student_id" class="form-control" required placeholder="YYYY-S-DDD-NNN (e.g. 2023-2-60-010)">
            </div>
            
            <div class="form-group">
                <label class="form-label">EWU Email</label>
                <input type="email" name="email" class="form-control" required placeholder="studentID@std.ewubd.edu">
                <small class="text-muted mt-2 block">Must match the exact structure and be your EWU address.</small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Department</label>
                <input type="text" name="department" class="form-control" required placeholder="e.g. CSE">
            </div>
            
            <div class="form-group">
                <label class="form-label">Account Type</label>
                <select name="role" id="role-select" class="form-control" onchange="toggleGradeReport()">
                    <option value="learner">I want to be a Learner</option>
                    <option value="tutor">I want to be a Tutor</option>
                </select>
                <small class="text-muted mt-2 block">You can switch roles later.</small>
            </div>

            <div class="form-group" id="grade-report-group" style="display: none; background-color: var(--bg-dark); padding: 1rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                <label class="form-label text-warning mb-2">Tutor Verification (Required)</label>
                <p class="text-xs text-muted mb-2">To become a tutor, please upload your official university Grade Report (PDF format only).</p>
                <input type="file" name="grade_report" id="grade_report" class="form-control" accept="application/pdf">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
        </form>
    </div>
</div>

<script>
    function toggleGradeReport() {
        const role = document.getElementById('role-select').value;
        const uploadGrp = document.getElementById('grade-report-group');
        const fileInput = document.getElementById('grade_report');
        if (role === 'tutor') {
            uploadGrp.style.display = 'block';
            fileInput.required = true;
        } else {
            uploadGrp.style.display = 'none';
            fileInput.required = false;
        }
    }
</script>
{% endblock %}
