{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="card">
        <h2 class="mb-4 text-center text-teal">Verify Your Account</h2>
        
        <p class="text-muted text-center" style="font-size: 0.9rem; margin-bottom: 2rem;">
            We've sent a 6-digit verification code to your email (<b>{{ email }}</b>). Please enter it below to activate your account.
        </p>

        <form method="POST" action="{{ url_for('verify_signup') }}">
            <div class="form-group">
                <label class="form-label">Verification Code</label>
                <input type="text" name="code" class="form-control" required placeholder="123456" maxlength="6">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Verify & Activate</button>
        </form>

        <p class="text-center mt-4 text-muted">
            Check your university inbox!
        </p>
    </div>
</div>
{% endblock %}
