{% extends "base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto;">
    <div class="card">
        <h2 class="mb-4 text-center text-teal">Reset Password</h2>
        <p class="text-muted text-center" style="font-size: 0.9rem; margin-bottom: 2rem;">
            Enter your EWU email address associated with your account. Since this is an internal web environment, we will automatically reset your password and output your temporary password instantly.
        </p>
        
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="student@std.ewubd.edu">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Reset Password</button>
        </form>
        <p class="text-center mt-4 text-muted">
            Remembered? <a href="{{ url_for('login') }}" class="text-teal" style="text-decoration: none;">Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
